
services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: netpulse-kafka
    ports:
      - "127.0.0.1:9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093

      KAFKA_LISTENERS: EXTERNAL://:9092,INTERNAL://:29092,CONTROLLER://:9093

      KAFKA_ADVERTISED_LISTENERS: EXTERNAL://127.0.0.1:9092,INTERNAL://kafka:29092

      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: EXTERNAL:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes:
      - kafka-data:/var/lib/kafka/data

  postgres:
    image: postgres:17
    container_name: netpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: netpulse
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: netpulse
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U netpulse -d netpulse"]
      interval: 10s
      timeout: 5s
      retries: 5

  airflow:
    build:
      context: ..
      dockerfile: docker/Dockerfile.airflow
    image: netpulse-airflow:local
    container_name: netpulse-airflow
    restart: unless-stopped
    env_file:
      - ../airflow/.env
    environment:
      PYTHONPATH: /opt/netpulse
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../airflow/dags:/opt/airflow/dags
      - ../airflow/logs:/opt/airflow/logs
      - ../airflow/plugins:/opt/airflow/plugins
      - ../src:/opt/netpulse/src:ro
    command: standalone
    depends_on:
      postgres:
        condition: service_healthy

  consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile.consumer
    image: netpulse-consumer:local
    container_name: netpulse-consumer
    restart: unless-stopped

    env_file:
      - ../airflow/.env

    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092

    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started


  grafana:
    image: grafana/grafana:12.3.1
    container_name: netpulse-grafana
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}

    volumes:
      - grafana-data:/var/lib/grafana

    depends_on:
      postgres:
        condition: service_healthy


volumes:
  kafka-data:
  postgres-data:
  grafana-data:
